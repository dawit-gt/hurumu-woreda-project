services:
  - type: web
    name: hurumu-api
    runtime: node
    rootDir: hurumu-api
    buildCommand: npm install --include=dev --unsafe-perm && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://<your-vercel-frontend>.vercel.app
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

databases:
  - name: hurumu-db
    databaseName: hurumu_woreda_db
    user: hurumu_admin
    plan: free
